name: Sonda da fonte B3

# Teste descartável: responde se a fonte B3 atende a partir do GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: ["claude/project-thread-qwt4uo"]
    paths:
      - "scripts/sonda_fonte_b3.py"
      - ".github/workflows/sonda-fonte-b3.yml"

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sonda_fonte_b3.py
