[project]
name = "winds"
version = "0.0.0"
description = "Proventos do dia a partir dos avisos da B3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coletor", "parser", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
